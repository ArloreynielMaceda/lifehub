<div style="font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 15px; line-height: 1.6; color: #1b1f1d; max-width: 480px;">
  <h2 style="font-weight: 600;">Reset your password</h2>
  <p>We received a request to reset the password for your LifeHub account.</p>
  <p>
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery"
       style="display: inline-block; background: #1d6746; color: #ffffff; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: 600;">
      Choose a new password
    </a>
  </p>
  <p style="color: #5f6360; font-size: 13px;">This link expires in one hour and can only be used once. If you didn't ask to reset your password, you can ignore this email — your password won't change.</p>
</div>
