<div style="font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 15px; line-height: 1.6; color: #1b1f1d; max-width: 480px;">
  <h2 style="font-weight: 600;">Confirm your email</h2>
  <p>Welcome to LifeHub! Confirm your email address to activate your account.</p>
  <p>
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/verify-email"
       style="display: inline-block; background: #1d6746; color: #ffffff; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: 600;">
      Confirm my email
    </a>
  </p>
  <p style="color: #5f6360; font-size: 13px;">If you didn't create a LifeHub account, you can ignore this email.</p>
</div>
